module:
  imports:
    - path: github.com/HugoBlox/kit/modules/blox

title: La Ferme du Moulin Neuf
baseURL: /

# Autorisations de sécurité
security:
  exec:
    allow:
      - '^(dart-)?sass$'
      - '^go$'
      - '^git$'
      - '^node$'
      - '^postcss$'
      - '^tailwindcss$'
  node:
    permissions:
      allowAddons:
        - 'tailwindcss'
      allowChildProcess:
        - 'tailwindcss'
      allowWorker:
        - 'tailwindcss'

# Indiquer à Hugo que Tailwind est un binaire autonome
build:
  binaries:
    tailwindcss:
      command: tailwindcss
      is_node_script: false
